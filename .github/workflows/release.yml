name: Release DMG

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test
        # Rendered Settings and popover checks require a desktop and run locally.
        run: swift test --skip PopoverAlignmentTests

      - name: Build and verify universal DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./package-dmg.sh "$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dmg="dist/Glance-$version-universal.dmg"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$dmg" "$dmg.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$dmg" "$dmg.sha256" \
              --verify-tag --title "Glance $RELEASE_TAG" --generate-notes \
              --notes "Universal macOS app for Apple Silicon and Intel (macOS 14+). Open the DMG and drag Glance into Applications. This build is ad hoc signed and is not notarized by Apple."
          fi
