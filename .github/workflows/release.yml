name: Release DMG

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Require release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          python3 -B scripts/release_notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/glance-release-notes.md"

      - name: Test
        # Rendered Settings, metric dashboards, and popover checks run locally.
        run: swift test --skip 'PopoverAlignmentTests|MetricNavigationTests'

      - name: Build and verify universal DMG
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./package-dmg.sh "$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dmg="dist/Glance-$version-universal.dmg"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$dmg" "$dmg.sha256" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/glance-release-notes.md"
          else
            gh release create "$RELEASE_TAG" "$dmg" "$dmg.sha256" \
              --verify-tag --title "Glance $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/glance-release-notes.md"
          fi
